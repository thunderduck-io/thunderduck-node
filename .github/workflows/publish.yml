name: publish

# Runs in the public mirror (thunderduck-io/thunderduck-node), where npm can
# attest a public source. The monorepo is private, so provenance cannot be
# generated there.
#
# Auth is npm Trusted Publishing (OIDC): the `id-token: write` permission lets
# npm mint a short-lived credential, so there is no NPM_TOKEN secret. Configure
# a trusted publisher on the npm package for this repository, this workflow
# file (`publish.yml`) and the `npm` environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) needs npm 11.5.1 or newer, which is not what
      # the runner's Node ships with.
      - name: Install current npm
        run: npm install -g npm@latest
      - name: Check the tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag '$REF_NAME' is not semver (expected vX.Y.Z[-suffix])"; exit 1; }
          PKG_VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" == "$PKG_VERSION" ]] \
            || { echo "::error::tag version '$VERSION' does not match package.json ($PKG_VERSION)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tagged commit $GITHUB_SHA is not on main; refusing to publish"; exit 1; }
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test before publishing
        run: npm test
      - name: Publish
        run: npm publish --provenance --access public
